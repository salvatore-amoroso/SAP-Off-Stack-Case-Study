[package]
name = "sap-order-poller"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "poller"

[lib]
name = "sap_order_poller"
path = "src/lib.rs"

[[bin]]
name = "poller"
path = "src/main.rs"

[[bin]]
name = "sql-poller"
path = "src/sql_main.rs"
required-features = ["sql"]

[[bin]]
name = "sql-profile"
path = "src/sql_profile_main.rs"
required-features = ["native-hana"]

[features]
default = []
sql = []
native-hana = ["sql", "dep:hdbconnect"]
abap-odbc = ["sql", "dep:odbc-api"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "unbounded_depth"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
url = "2"
hdbconnect = { version = "0.33", optional = true }
odbc-api = { version = "29.2", default-features = false, features = ["odbc_version_3_5"], optional = true }
