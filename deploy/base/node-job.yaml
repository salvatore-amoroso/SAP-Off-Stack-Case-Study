apiVersion: batch/v1
kind: Job
metadata:
  name: poller-node
  labels:
    app.kubernetes.io/part-of: sap-order-polling-lab
spec:
  suspend: true
  backoffLimit: 0
  completions: 1
  parallelism: 1
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: poller-node
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: poller
          image: sap-polling-node:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: polling-config
            - secretRef:
                name: sap-credentials
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
